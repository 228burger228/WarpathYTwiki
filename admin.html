<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Админ-панель — Warpath Guide</title>
<link rel="stylesheet" href="style.css">
<style>
/* ══════════════════════════════════════
   ADMIN PANEL STYLES
══════════════════════════════════════ */
.admin-container {
  min-height: 100vh;
  background: var(--bg);
  padding-top: 56px;
}

.admin-header {
  background: var(--bg2);
  border-bottom: var(--line);
  padding: 1.5rem 2rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.admin-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.5rem;
  letter-spacing: 2px;
  color: var(--gold2);
}

.admin-logout {
  background: rgba(224,72,72,.12);
  border: 1px solid rgba(224,72,72,.3);
  color: #e04848;
  padding: .5rem 1rem;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: .75rem;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  border-radius: 6px;
  cursor: pointer;
  transition: all .2s;
}

.admin-logout:hover {
  background: rgba(224,72,72,.22);
  border-color: rgba(224,72,72,.5);
}

/* Login form */
.admin-login {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem;
}

.admin-login-box {
  max-width: 400px;
  width: 100%;
  background: var(--panel);
  border: var(--line);
  border-radius: 12px;
  padding: 2.5rem 2rem;
}

.admin-login-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.8rem;
  letter-spacing: 2px;
  color: var(--gold2);
  margin-bottom: 1rem;
  text-align: center;
}

.admin-login-desc {
  color: var(--dim);
  font-size: .9rem;
  text-align: center;
  margin-bottom: 2rem;
}

.admin-field {
  margin-bottom: 1.5rem;
}

.admin-label {
  display: block;
  font-size: .75rem;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: .5rem;
}

.admin-input {
  width: 100%;
  background: var(--bg3);
  border: var(--line);
  color: var(--text);
  padding: .75rem 1rem;
  font-size: .9rem;
  border-radius: 6px;
  outline: none;
  transition: all .2s;
}

.admin-input:focus {
  border-color: var(--gold);
  box-shadow: 0 0 12px rgba(200,150,28,.15);
}

.admin-btn {
  width: 100%;
  background: linear-gradient(135deg, var(--gold), var(--orange));
  color: #000;
  padding: .85rem;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: .85rem;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  transition: all .2s;
}

.admin-btn:hover {
  opacity: .85;
  transform: translateY(-2px);
}

.admin-error {
  background: rgba(224,72,72,.12);
  border: 1px solid rgba(224,72,72,.3);
  color: #e04848;
  padding: 1rem;
  border-radius: 6px;
  margin-bottom: 1.5rem;
  font-size: .9rem;
}

/* Main content */
.admin-content {
  max-width: 1280px;
  margin: 0 auto;
  padding: 2rem;
}

.admin-tabs {
  display: flex;
  gap: .5rem;
  margin-bottom: 2rem;
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
}

.admin-tab-btn {
  padding: 1rem 1.5rem;
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--muted);
  font-family: 'Barlow Condensed', sans-serif;
  font-size: .85rem;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all .2s;
  white-space: nowrap;
}

.admin-tab-btn:hover {
  color: var(--gold2);
}

.admin-tab-btn.active {
  color: var(--gold2);
  border-bottom-color: var(--gold);
}

.admin-tab {
  display: none;
}

.admin-tab.active {
  display: block;
}

.admin-form {
  background: var(--panel);
  border: var(--line);
  border-radius: 8px;
  padding: 2rem;
  margin-bottom: 2rem;
}

.admin-form-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.3rem;
  letter-spacing: 2px;
  color: var(--gold2);
  margin-bottom: 1.5rem;
  padding-bottom: 1rem;
  border-bottom: 1px solid var(--border);
}

.admin-form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.5rem;
  margin-bottom: 1.5rem;
}

.admin-form-row.full {
  grid-template-columns: 1fr;
}

.admin-textarea {
  width: 100%;
  background: var(--bg3);
  border: var(--line);
  color: var(--text);
  padding: .75rem 1rem;
  font-size: .9rem;
  font-family: inherit;
  border-radius: 6px;
  outline: none;
  resize: vertical;
  min-height: 120px;
  transition: all .2s;
}

.admin-textarea:focus {
  border-color: var(--gold);
  box-shadow: 0 0 12px rgba(200,150,28,.15);
}

.admin-buttons {
  display: flex;
  gap: 1rem;
  flex-wrap: wrap;
}

.admin-btn-primary {
  background: linear-gradient(135deg, var(--gold), var(--orange));
  color: #000;
  padding: .75rem 1.5rem;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: .8rem;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  transition: all .2s;
}

.admin-btn-primary:hover {
  opacity: .85;
  transform: translateY(-2px);
}

.admin-btn-secondary {
  background: var(--bg3);
  border: 1px solid var(--border);
  color: var(--text);
  padding: .75rem 1.5rem;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: .8rem;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  border-radius: 6px;
  cursor: pointer;
  transition: all .2s;
}

.admin-btn-secondary:hover {
  border-color: var(--gold);
  color: var(--gold2);
}

.admin-list {
  background: var(--panel);
  border: var(--line);
  border-radius: 8px;
  overflow: hidden;
}

.admin-list-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1rem;
  border-bottom: 1px solid var(--border);
}

.admin-list-item:last-child {
  border-bottom: none;
}

.admin-list-item-text {
  flex: 1;
}

.admin-list-item-title {
  font-weight: 700;
  color: var(--text);
  margin-bottom: .25rem;
}

.admin-list-item-desc {
  font-size: .85rem;
  color: var(--dim);
}

.admin-list-item-actions {
  display: flex;
  gap: .5rem;
}

.admin-btn-small {
  padding: .4rem .8rem;
  font-size: .7rem;
  font-weight: 700;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  border-radius: 4px;
  cursor: pointer;
  transition: all .2s;
}

.admin-btn-small:hover {
  border-color: var(--gold);
  color: var(--gold2);
}

.admin-btn-small.delete {
  border-color: rgba(224,72,72,.3);
  color: #e04848;
}

.admin-btn-small.delete:hover {
  border-color: #e04848;
  background: rgba(224,72,72,.12);
}

.admin-success {
  background: rgba(126,200,80,.12);
  border: 1px solid rgba(126,200,80,.3);
  color: #7ec850;
  padding: 1rem;
  border-radius: 6px;
  margin-bottom: 1.5rem;
  font-size: .9rem;
}

@media (max-width: 768px) {
  .admin-form-row {
    grid-template-columns: 1fr;
  }

  .admin-tabs {
    gap: 0;
  }

  .admin-tab-btn {
    padding: .75rem 1rem;
    font-size: .75rem;
  }
}
</style>
</head>
<body>

<div class="admin-container">
  <!-- Login form -->
  <div id="admin-login" class="admin-login" style="display: none;">
    <div class="admin-login-box">
      <h1 class="admin-login-title">🔐 Админ-панель</h1>
      <p class="admin-login-desc">Введите пароль для доступа</p>
      <div id="admin-error" class="admin-error" style="display: none;"></div>
      <form id="admin-login-form" onsubmit="return false;">
        <div class="admin-field">
          <label class="admin-label">Пароль</label>
          <input type="password" id="admin-password" class="admin-input" placeholder="Введите пароль" required>
        </div>
        <button type="button" class="admin-btn" onclick="adminLogin()">Войти</button>
      </form>
    </div>
  </div>

  <!-- Main content -->
  <div id="admin-main" style="display: none;">
    <div class="admin-header">
      <h1 class="admin-title">⚙ Админ-панель</h1>
      <button class="admin-logout" onclick="adminLogout()">Выход</button>
    </div>

    <div class="admin-content">
      <!-- Tabs -->
      <div class="admin-tabs">
        <button class="admin-tab-btn active" onclick="switchTab('faq')">❓ FAQ</button>
        <button class="admin-tab-btn" onclick="switchTab('officers')">🎖 Офицеры</button>
        <button class="admin-tab-btn" onclick="switchTab('patch')">📦 Патч</button>
        <button class="admin-tab-btn" onclick="switchTab('news')">📰 Новости</button>
      </div>

      <!-- FAQ Tab -->
      <div id="faq-tab" class="admin-tab active">
        <div class="admin-form">
          <h2 class="admin-form-title">Добавить вопрос</h2>
          <div class="admin-form-row">
            <div>
              <label class="admin-label">Категория</label>
              <select id="faq-category" class="admin-input">
                <option value="mechanics">Механика</option>
                <option value="units">Юниты</option>
                <option value="officers">Офицеры</option>
                <option value="strategy">Стратегия</option>
                <option value="economy">Экономика</option>
                <option value="events">События</option>
              </select>
            </div>
          </div>
          <div class="admin-form-row full">
            <div>
              <label class="admin-label">Вопрос</label>
              <input type="text" id="faq-question" class="admin-input" placeholder="Введите вопрос">
            </div>
          </div>
          <div class="admin-form-row full">
            <div>
              <label class="admin-label">Ответ</label>
              <textarea id="faq-answer" class="admin-textarea" placeholder="Введите ответ"></textarea>
            </div>
          </div>
          <div class="admin-form-row full">
            <div>
              <label class="admin-label">Теги (через запятую)</label>
              <input type="text" id="faq-tags" class="admin-input" placeholder="tag1, tag2, tag3">
            </div>
          </div>
          <div class="admin-buttons">
            <button class="admin-btn-primary" onclick="addFAQQuestion()">➕ Добавить</button>
            <button class="admin-btn-secondary" onclick="clearFAQForm()">Очистить</button>
          </div>
        </div>

        <div id="faq-list" class="admin-list"></div>
      </div>

      <!-- Officers Tab -->
      <div id="officers-tab" class="admin-tab">
        <div class="admin-form">
          <h2 class="admin-form-title">Обновить офицера</h2>
          <p style="color: var(--dim); margin-bottom: 1.5rem;">Функция в разработке</p>
        </div>
      </div>

      <!-- Patch Tab -->
      <div id="patch-tab" class="admin-tab">
        <div class="admin-form">
          <h2 class="admin-form-title">Информация о патче</h2>
          <div class="admin-form-row">
            <div>
              <label class="admin-label">Версия патча</label>
              <input type="text" id="patch-version" class="admin-input" placeholder="14.0">
            </div>
          </div>
          <div class="admin-form-row full">
            <div>
              <label class="admin-label">Описание</label>
              <textarea id="patch-notes" class="admin-textarea" placeholder="Описание изменений в патче"></textarea>
            </div>
          </div>
          <div class="admin-buttons">
            <button class="admin-btn-primary" onclick="updatePatchInfo()">💾 Сохранить</button>
          </div>
        </div>
      </div>

      <!-- News Tab -->
      <div id="news-tab" class="admin-tab">
        <div class="admin-form">
          <h2 class="admin-form-title">Добавить новость</h2>
          <div class="admin-form-row full">
            <div>
              <label class="admin-label">Заголовок</label>
              <input type="text" id="news-title" class="admin-input" placeholder="Заголовок новости">
            </div>
          </div>
          <div class="admin-form-row full">
            <div>
              <label class="admin-label">Содержание</label>
              <textarea id="news-content" class="admin-textarea" placeholder="Содержание новости"></textarea>
            </div>
          </div>
          <div class="admin-buttons">
            <button class="admin-btn-primary" onclick="addNews()">➕ Добавить</button>
            <button class="admin-btn-secondary" onclick="clearNewsForm()">Очистить</button>
          </div>
        </div>

        <div id="news-list" class="admin-list"></div>
      </div>
    </div>
  </div>
</div>

<script src="i18n.js"></script>
<script src="theme-manager.js"></script>
<script src="pwa-init.js"></script>
<script src="nav.js"></script>
<script src="faq-data.js"></script>

<script>
// ═══════════════════════════════════════
// ADMIN PANEL LOGIC
// ═══════════════════════════════════════

const ADMIN_PASSWORD_HASH = 'admin123'; // В реальном приложении использовать SHA-256
const AUTH_TOKEN_KEY = 'admin-auth-token';
const AUTH_EXPIRY_KEY = 'admin-auth-expiry';
const TOKEN_EXPIRY_DAYS = 7;

// Проверяем аутентификацию при загрузке
document.addEventListener('DOMContentLoaded', () => {
  checkAuth();
  loadFAQList();
  loadNewsList();
});

function checkAuth() {
  const token = localStorage.getItem(AUTH_TOKEN_KEY);
  const expiry = localStorage.getItem(AUTH_EXPIRY_KEY);

  if (token && expiry && new Date().getTime() < parseInt(expiry)) {
    showMainContent();
  } else {
    showLoginForm();
    localStorage.removeItem(AUTH_TOKEN_KEY);
    localStorage.removeItem(AUTH_EXPIRY_KEY);
  }
}

function adminLogin() {
  const password = document.getElementById('admin-password').value;
  const errorDiv = document.getElementById('admin-error');

  if (password === ADMIN_PASSWORD_HASH) {
    const token = 'token_' + Date.now();
    const expiry = new Date().getTime() + (TOKEN_EXPIRY_DAYS * 24 * 60 * 60 * 1000);
    
    localStorage.setItem(AUTH_TOKEN_KEY, token);
    localStorage.setItem(AUTH_EXPIRY_KEY, expiry.toString());
    
    showMainContent();
    errorDiv.style.display = 'none';
  } else {
    errorDiv.textContent = '❌ Неверный пароль';
    errorDiv.style.display = 'block';
  }
}

function adminLogout() {
  localStorage.removeItem(AUTH_TOKEN_KEY);
  localStorage.removeItem(AUTH_EXPIRY_KEY);
  showLoginForm();
}

function showLoginForm() {
  document.getElementById('admin-login').style.display = 'flex';
  document.getElementById('admin-main').style.display = 'none';
}

function showMainContent() {
  document.getElementById('admin-login').style.display = 'none';
  document.getElementById('admin-main').style.display = 'block';
}

function switchTab(tabName) {
  // Скрываем все табы
  document.querySelectorAll('.admin-tab').forEach(tab => tab.classList.remove('active'));
  document.querySelectorAll('.admin-tab-btn').forEach(btn => btn.classList.remove('active'));

  // Показываем выбранный таб
  document.getElementById(tabName + '-tab').classList.add('active');
  event.target.classList.add('active');
}

// ═══ FAQ FUNCTIONS ═══
function addFAQQuestion() {
  const category = document.getElementById('faq-category').value;
  const question = document.getElementById('faq-question').value;
  const answer = document.getElementById('faq-answer').value;
  const tags = document.getElementById('faq-tags').value.split(',').map(t => t.trim());

  if (!question || !answer) {
    alert('Заполните все поля');
    return;
  }

  const newQuestion = {
    id: 'faq-' + Date.now(),
    category,
    question,
    answer,
    tags
  };

  let faqData = JSON.parse(localStorage.getItem('faq-custom') || '[]');
  faqData.push(newQuestion);
  localStorage.setItem('faq-custom', JSON.stringify(faqData));

  clearFAQForm();
  loadFAQList();
  alert('✅ Вопрос добавлен');
}

function loadFAQList() {
  const list = document.getElementById('faq-list');
  const faqData = JSON.parse(localStorage.getItem('faq-custom') || '[]');

  if (faqData.length === 0) {
    list.innerHTML = '<div style="padding: 2rem; text-align: center; color: var(--muted);">Нет добавленных вопросов</div>';
    return;
  }

  list.innerHTML = faqData.map(q => `
    <div class="admin-list-item">
      <div class="admin-list-item-text">
        <div class="admin-list-item-title">${q.question}</div>
        <div class="admin-list-item-desc">${q.answer.substring(0, 100)}...</div>
      </div>
      <div class="admin-list-item-actions">
        <button class="admin-btn-small" onclick="editFAQ('${q.id}')">✏ Редактировать</button>
        <button class="admin-btn-small delete" onclick="deleteFAQ('${q.id}')">🗑 Удалить</button>
      </div>
    </div>
  `).join('');
}

function deleteFAQ(id) {
  if (!confirm('Вы уверены?')) return;
  
  let faqData = JSON.parse(localStorage.getItem('faq-custom') || '[]');
  faqData = faqData.filter(q => q.id !== id);
  localStorage.setItem('faq-custom', JSON.stringify(faqData));
  
  loadFAQList();
  alert('✅ Вопрос удалён');
}

function clearFAQForm() {
  document.getElementById('faq-question').value = '';
  document.getElementById('faq-answer').value = '';
  document.getElementById('faq-tags').value = '';
}

// ═══ NEWS FUNCTIONS ═══
function addNews() {
  const title = document.getElementById('news-title').value;
  const content = document.getElementById('news-content').value;

  if (!title || !content) {
    alert('Заполните все поля');
    return;
  }

  const news = {
    id: 'news-' + Date.now(),
    title,
    content,
    date: new Date().toLocaleDateString('ru-RU')
  };

  let newsData = JSON.parse(localStorage.getItem('news-custom') || '[]');
  newsData.unshift(news);
  localStorage.setItem('news-custom', JSON.stringify(newsData));

  clearNewsForm();
  loadNewsList();
  alert('✅ Новость добавлена');
}

function loadNewsList() {
  const list = document.getElementById('news-list');
  const newsData = JSON.parse(localStorage.getItem('news-custom') || '[]');

  if (newsData.length === 0) {
    list.innerHTML = '<div style="padding: 2rem; text-align: center; color: var(--muted);">Нет добавленных новостей</div>';
    return;
  }

  list.innerHTML = newsData.map(n => `
    <div class="admin-list-item">
      <div class="admin-list-item-text">
        <div class="admin-list-item-title">${n.title}</div>
        <div class="admin-list-item-desc">${n.date}</div>
      </div>
      <div class="admin-list-item-actions">
        <button class="admin-btn-small delete" onclick="deleteNews('${n.id}')">🗑 Удалить</button>
      </div>
    </div>
  `).join('');
}

function deleteNews(id) {
  if (!confirm('Вы уверены?')) return;
  
  let newsData = JSON.parse(localStorage.getItem('news-custom') || '[]');
  newsData = newsData.filter(n => n.id !== id);
  localStorage.setItem('news-custom', JSON.stringify(newsData));
  
  loadNewsList();
  alert('✅ Новость удалена');
}

function clearNewsForm() {
  document.getElementById('news-title').value = '';
  document.getElementById('news-content').value = '';
}

// ═══ PATCH FUNCTIONS ═══
function updatePatchInfo() {
  const version = document.getElementById('patch-version').value;
  const notes = document.getElementById('patch-notes').value;

  if (!version) {
    alert('Введите версию патча');
    return;
  }

  localStorage.setItem('patch-version', version);
  localStorage.setItem('patch-notes', notes);
  
  alert('✅ Информация о патче обновлена');
}
</script>

</body>
</html>
